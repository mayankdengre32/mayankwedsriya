<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4A060E" />
      <stop offset="60%" stop-color="#240306" />
      <stop offset="100%" stop-color="#120103" />
    </radialGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC" />
      <stop offset="25%" stop-color="#E8C97A" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="75%" stop-color="#F5DF9E" />
      <stop offset="100%" stop-color="#9E7628" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)" />

  <!-- Outer & Inner Gold Filigree Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="14" />
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.75" />

  <!-- Top Crown Accent Star -->
  <path d="M256 64 L262 78 L276 84 L262 90 L256 104 L250 90 L236 84 L250 78 Z" fill="url(#goldGrad)" />
  <circle cx="218" cy="84" r="3.5" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="294" cy="84" r="3.5" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- MR Initials Monogram -->
  <text x="256" y="306"
        font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Times New Roman', serif"
        font-size="196"
        font-weight="700"
        letter-spacing="6"
        text-anchor="middle"
        fill="url(#goldGrad)"
        filter="url(#goldGlow)">MR</text>

  <!-- Bottom Elegant Flourish -->
  <path d="M256 360 L264 370 L256 380 L248 370 Z" fill="url(#goldGrad)" />
  <line x1="176" y1="370" x2="236" y2="370" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
  <line x1="276" y1="370" x2="336" y2="370" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.7"/>
  <circle cx="166" cy="370" r="3.5" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="346" cy="370" r="3.5" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
